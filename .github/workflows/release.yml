name: Stable firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Arm GNU toolchain 12.3
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/opt/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi
          key: armgnu-12.3.rel1-x86_64

      - name: Install Arm GNU toolchain 12.3
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/opt && cd ~/opt
          curl -fSL -o armgnu.tar.xz \
            https://developer.arm.com/-/media/Files/downloads/gnu/12.3.rel1/binrel/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xf armgnu.tar.xz
          rm armgnu.tar.xz

      - name: Verify release version
        run: |
          HUD_VERSION=$(sed -n 's/^#define HUD_VERSION "\(.*\)"/\1/p' FlySight/activelook_mode0.c | head -1)
          test "$GITHUB_REF_NAME" = "v$HUD_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match HUD_VERSION $HUD_VERSION"
            exit 1
          }
          test "$(sed -n 's/^#define FS_BLE_DIAG \([01]\)$/\1/p' FlySight/ble_diag.h)" = 0 || {
            echo "Refusing to publish stable firmware with BLEDIAG enabled"
            exit 1
          }

      - name: Host unit tests
        run: cd Tests && make run

      - name: Build firmware
        run: |
          make PREFIX=$HOME/opt/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-
          test -f build/UserApp.bin
          strings build/FlySight.elf | grep -q "$GITHUB_REF_NAME"

      - name: Encrypt for every batch
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet coincurve pycryptodome
          cp build/UserApp.bin Deploy/Firmware_As_Built/UserApp.bin
          mkdir -p out
          cd Deploy
          for B in B2 B3 B4 B5 B6 B7 B8 B9; do
            k=$(echo "$B" | tr 'A-Z' 'a-z')
            ../.venv/bin/python -c "import deploy_firmware as d; d.encrypt_firmware_with_key('Firmware_As_Built/UserApp.bin','UserApp','Public_Keys/pub_key_${k}.bin','${B}')"
            cp "Firmware_To_Deploy/${B}_UserApp.sfb" "../out/FlySight2-ENGO-HUD-${B}.sfb"
          done
          cd ../out
          for f in *.sfb; do [ "$(head -c4 "$f")" = "SFU1" ] || { echo "BAD container: $f"; exit 1; }; done
          sha256sum *.sfb > sha256sums.txt
          cat sha256sums.txt

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          The Validation Window no longer opens in the aircraft.

          **What was wrong.** The window arms on the first sample descending at 10 m/s and latches the origin of the Designated Flight Path nine seconds later. 10 m/s is 2000 ft/min, which a jump ship reaches easily: on 2026-09-05 a pilot took the lane run high and let down before the exit, the descent crossed the threshold twice, and the first crossing opened the window in the aeroplane. The origin landed 1111 m and four and a half minutes from the exit, and the lane was drawn about it with complete confidence.

          Duration does not separate the two -- the second letdown stayed above 10 m/s for 10.6 s, longer than the window itself. Speed does. Across three jumps the aircraft peaked at 14.5 and 13.4 m/s where the exits peaked at 30.8, 33.0 and 32.2. So the peak descent inside the nine seconds now has to reach 20 m/s before the origin latches, and an arming that fails may not start again until the descent has come back under 10 m/s. The confirmation arrives seconds before the latch, so **where the origin falls is unchanged** -- this rejects false windows, it does not move real ones.

          **What it costs.** An exit taken while the aircraft is already descending faster than 10 m/s has no threshold crossing of its own to arm on, and draws no lane at all. That trade was made deliberately: the failure it replaces was a lane drawn confidently in the wrong place, which a competitor cannot see, and this one he can.

          The lane indicator has not been flown at the full panel width added in v0.0.42, and this window logic has not been flown at all. Both are covered by host tests replaying the real tracks.

          Choose the file matching the `Pubkey_X` batch in `FLYSIGHT.TXT`, rename it to `APP.SFB`, and install it using Groundrush, the web flasher, or the orange-light USB bootloader. The wrong batch is safely ignored. Batches B2-B9 are covered.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            out/*.sfb out/sha256sums.txt
