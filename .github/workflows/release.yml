name: Stable firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Arm GNU toolchain 12.3
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/opt/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi
          key: armgnu-12.3.rel1-x86_64

      - name: Install Arm GNU toolchain 12.3
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/opt && cd ~/opt
          curl -fSL -o armgnu.tar.xz \
            https://developer.arm.com/-/media/Files/downloads/gnu/12.3.rel1/binrel/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xf armgnu.tar.xz
          rm armgnu.tar.xz

      - name: Verify release version
        run: |
          HUD_VERSION=$(sed -n 's/^#define HUD_VERSION "\(.*\)"/\1/p' FlySight/activelook_mode0.c | head -1)
          test "$GITHUB_REF_NAME" = "v$HUD_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match HUD_VERSION $HUD_VERSION"
            exit 1
          }
          test "$(sed -n 's/^#define FS_BLE_DIAG \([01]\)$/\1/p' FlySight/ble_diag.h)" = 0 || {
            echo "Refusing to publish stable firmware with BLEDIAG enabled"
            exit 1
          }

      - name: Host unit tests
        run: cd Tests && make run

      - name: Build firmware
        run: |
          make PREFIX=$HOME/opt/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-
          test -f build/UserApp.bin
          strings build/FlySight.elf | grep -q "$GITHUB_REF_NAME"

      - name: Encrypt for every batch
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet coincurve pycryptodome
          cp build/UserApp.bin Deploy/Firmware_As_Built/UserApp.bin
          mkdir -p out
          cd Deploy
          for B in B2 B3 B4 B5 B6 B7 B8 B9; do
            k=$(echo "$B" | tr 'A-Z' 'a-z')
            ../.venv/bin/python -c "import deploy_firmware as d; d.encrypt_firmware_with_key('Firmware_As_Built/UserApp.bin','UserApp','Public_Keys/pub_key_${k}.bin','${B}')"
            cp "Firmware_To_Deploy/${B}_UserApp.sfb" "../out/FlySight2-ENGO-HUD-${B}.sfb"
          done
          cd ../out
          for f in *.sfb; do [ "$(head -c4 "$f")" = "SFU1" ] || { echo "BAD container: $f"; exit 1; }; done
          sha256sum *.sfb > sha256sums.txt
          cat sha256sums.txt

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Two readability fixes, both from looking at the glasses.

          **The lane rungs are three pixels thick.** They were one -- a hairline, legible on a bench and thin against sky. A rung is now a filled 3 px box about its own column with 9 px of gap beside it, so it is still a ladder to be counted rather than a bar to be read. Pitch, rung count and the 25 m each rung is worth are unchanged, and so is the cost of the frame: thirteen packets, drawn with the same opcode the centre bar has used since v0.0.40.

          **The distance under the navigation arrow shows tenths of a kilometre.** Whole kilometres put an entire drop zone on one reading: "2" for the minute it takes to cross a kilometre, then a jump of a whole unit, with nothing in between to steer by. Kilometres and miles now always carry at least one decimal whatever `AL_Dec` says on the card, and a card asking for two still gets two. Metres and feet go the other way and are always whole -- this caption is the one string on the panel carrying its unit inside it, so a decimal there spends 15 px of the width beside the arrow to name half a metre of range. Neither needs an edit to an existing layout.

          Both are covered by host tests and neither has been seen on glasses. The full-panel lane indicator added in v0.0.42 has still not been flown, nor has the Validation Window logic from v0.0.43.

          Choose the file matching the `Pubkey_X` batch in `FLYSIGHT.TXT`, rename it to `APP.SFB`, and install it using Groundrush, the web flasher, or the orange-light USB bootloader. The wrong batch is safely ignored. Batches B2-B9 are covered.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            out/*.sfb out/sha256sums.txt
