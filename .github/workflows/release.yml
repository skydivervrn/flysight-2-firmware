name: Stable firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Arm GNU toolchain 12.3
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/opt/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi
          key: armgnu-12.3.rel1-x86_64

      - name: Install Arm GNU toolchain 12.3
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/opt && cd ~/opt
          curl -fSL -o armgnu.tar.xz \
            https://developer.arm.com/-/media/Files/downloads/gnu/12.3.rel1/binrel/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xf armgnu.tar.xz
          rm armgnu.tar.xz

      - name: Verify release version
        run: |
          HUD_VERSION=$(sed -n 's/^#define HUD_VERSION "\(.*\)"/\1/p' FlySight/activelook_mode0.c | head -1)
          test "$GITHUB_REF_NAME" = "v$HUD_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match HUD_VERSION $HUD_VERSION"
            exit 1
          }
          test "$(sed -n 's/^#define FS_BLE_DIAG \([01]\)$/\1/p' FlySight/ble_diag.h)" = 0 || {
            echo "Refusing to publish stable firmware with BLEDIAG enabled"
            exit 1
          }

      - name: Host unit tests
        run: cd Tests && make run

      - name: Drop the nightly tag so git describe names this release
        # The nightly workflow moves the lightweight `nightly` tag onto every
        # push. When a stable tag lands on the same commit, `git describe
        # --tags` in the Makefile picked `nightly` over the annotated release
        # tag (seen on v0.0.45: Firmware_Ver would have read "nightly" and the
        # check below failed). Deleting the local copy makes describe
        # unambiguous; the remote tag is untouched.
        run: git tag -d nightly || true

      - name: Build firmware
        run: |
          make PREFIX=$HOME/opt/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-
          test -f build/UserApp.bin
          strings build/FlySight.elf | grep -q "$GITHUB_REF_NAME"

      - name: Encrypt for every batch
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet coincurve pycryptodome
          cp build/UserApp.bin Deploy/Firmware_As_Built/UserApp.bin
          mkdir -p out
          cd Deploy
          # DEV is not a batch: it is FlySight's published "dev" key, which the
          # first ~500 units (Pubkey_X all f's) switch to before they can take
          # any custom firmware. Same image, encrypted for pub_key_dev.bin.
          for B in B2 B3 B4 B5 B6 B7 B8 B9 DEV; do
            k=$(echo "$B" | tr 'A-Z' 'a-z')
            ../.venv/bin/python -c "import deploy_firmware as d; d.encrypt_firmware_with_key('Firmware_As_Built/UserApp.bin','UserApp','Public_Keys/pub_key_${k}.bin','${B}')"
            cp "Firmware_To_Deploy/${B}_UserApp.sfb" "../out/FlySight2-ENGO-HUD-${B}.sfb"
          done
          cd ../out
          for f in *.sfb; do [ "$(head -c4 "$f")" = "SFU1" ] || { echo "BAD container: $f"; exit 1; }; done
          sha256sum *.sfb > sha256sums.txt
          cat sha256sums.txt

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release text is the annotated tag's message, written with the
          # release it describes; only the install paragraph below is common to
          # every release. It used to be inlined here and was last edited for
          # v0.0.44, so v0.0.45 and v0.0.46 went out describing v0.0.44.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag || {
            echo "$GITHUB_REF_NAME is not an annotated tag, so there is no release text"
            exit 1
          }
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)' > notes.md
          grep -q '[^[:space:]]' notes.md || {
            echo "The message of $GITHUB_REF_NAME has no body, so there is no release text"
            exit 1
          }
          cat >> notes.md <<'EOF'

          Choose the file matching the `Pubkey_X` batch in `FLYSIGHT.TXT`, rename it to `APP.SFB`, and install it using Groundrush, the web flasher, or the orange-light USB bootloader. The wrong batch is safely ignored. Batches B2-B9 are covered, plus a `DEV` image for early units (first ~500, `Pubkey_X` all f's) once FlySight has switched them to its dev key.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            out/*.sfb out/sha256sums.txt
